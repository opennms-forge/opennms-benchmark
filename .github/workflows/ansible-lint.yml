---
name: Ansible Lint

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "deployments/**"
      - "experiments/**"
      - "opennms-playbook.yml"
      - "opennms-lab-vars.yml"
      - "requirements.yml"
      - ".ansible-lint"
      - "Makefile"

# CI invokes the `make lint-ansible` target, never ansible-lint directly, so local
# and CI stay in sync.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Install ansible-lint first: it pulls a known ansible-core into this
      # (setup-python-pinned) interpreter, and the ansible-galaxy used below
      # then comes from that same core — so lint resolves collections against
      # the core they were installed with. Pinned to match the previously used
      # ansible/ansible-lint@v26.6.0 action.
      - name: Install ansible-lint
        run: python3 -m pip install ansible-lint==26.6.0

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml', 'bootstrap/requirements.yml') }}

      - name: Install bootstrap collections
        run: ansible-galaxy collection install -r bootstrap/requirements.yml -p ~/.ansible/collections --force-with-deps

      - name: Install OpenNMS deployment collections
        run: ansible-galaxy collection install -r requirements.yml -p ~/.ansible/collections --force-with-deps

      - name: Set Ansible roles path
        run: echo "ANSIBLE_ROLES_PATH=$GITHUB_WORKSPACE/bootstrap/roles" >> "$GITHUB_ENV"

      # ansible-lint parses vault-encrypted group_vars but never decrypts them;
      # a throwaway password file lets them load without a real secret in CI.
      - name: Provide dummy vault password
        run: |
          mkdir -p ~/.config/ansible-opennms
          echo dummy > ~/.config/ansible-opennms/vault-pass
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$HOME/.config/ansible-opennms/vault-pass" >> "$GITHUB_ENV"

      - name: Run ansible-lint
        run: make lint-ansible
