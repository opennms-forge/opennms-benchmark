---
name: Terraform Lint

on:
  pull_request:
    paths:
      - "terraform/**"

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/

  validate-azure:
    name: Validate (Azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"

      - name: terraform init
        run: terraform init -backend=false
        working-directory: terraform/azure

      - name: terraform validate
        run: terraform validate
        working-directory: terraform/azure

  validate-kvm:
    name: Validate (KVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"

      - name: terraform init
        # -upgrade forces provider download; libvirt provider is a community
        # provider from dmacvicar/libvirt and installs without a running host
        run: terraform init -backend=false -upgrade
        working-directory: terraform/kvm

      - name: terraform validate
        # validate checks syntax and type correctness only — no provider API calls
        run: terraform validate
        working-directory: terraform/kvm

  validate-proxmox:
    name: Validate (Proxmox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"

      - name: terraform init
        # bpg/proxmox is a community provider and installs without a running host
        run: terraform init -backend=false
        working-directory: terraform/proxmox

      - name: terraform validate
        # validate checks syntax and type correctness only — no provider API calls
        run: terraform validate
        working-directory: terraform/proxmox

  validate-vmware:
    name: Validate (VMware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "~1.5"

      - name: terraform init
        # hashicorp/vsphere is a HashiCorp-maintained provider and installs without a running host
        run: terraform init -backend=false
        working-directory: terraform/vmware

      - name: terraform validate
        # validate checks syntax and type correctness only — no provider API calls
        run: terraform validate
        working-directory: terraform/vmware

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a  # v6.3.0
        with:
          tflint_version: latest

      - name: Init TFLint (Azure)
        run: tflint --init
        working-directory: terraform/azure
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint (Azure)
        run: tflint --recursive --minimum-failure-severity=error
        working-directory: terraform/azure

      - name: Init TFLint (KVM)
        run: tflint --init
        working-directory: terraform/kvm
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint (KVM)
        run: tflint --recursive --minimum-failure-severity=error
        working-directory: terraform/kvm

      - name: Init TFLint (Proxmox)
        run: tflint --init
        working-directory: terraform/proxmox
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint (Proxmox)
        run: tflint --recursive --minimum-failure-severity=error
        working-directory: terraform/proxmox

      - name: Init TFLint (VMware)
        run: tflint --init
        working-directory: terraform/vmware
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint (VMware)
        run: tflint --recursive --minimum-failure-severity=error
        working-directory: terraform/vmware
