---
version: 2
updates:
  # Glob covers every Terraform root under terraform/ (azure, kvm, proxmox,
  # vmware) and self-heals when a new platform directory is added.
  - package-ecosystem: "terraform"
    directories:
      - "/terraform/*"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
