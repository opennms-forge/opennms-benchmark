# Overlay for the HA shape test bed.

# Object store. The rustfs role ships no default credentials deliberately.
rustfs_access_key: mimir
rustfs_secret_key: mimir-lab-secret

# 3-node Mimir needs shared storage; the filesystem backend is per-node.
# By hostname: Mimir and RustFS both run as host processes, so the etc_hosts
# entries resolve for them.
mimir_s3_endpoint: "rustfs-benchmark-01:9000"
mimir_s3_access_key_id: mimir
mimir_s3_secret_access_key: mimir-lab-secret

# All Sentinels share a location so they form one pool; their controller ids
# stay distinct via machine_id, and the shared Kafka group.id is what makes
# them split the flow workload rather than each processing every record.
opennms_sentinel_controller:
  id: "{{ ansible_facts['machine_id'] if ansible_facts['machine_id'] is defined else inventory_hostname }}"
  location: lab-location-01

# The lab pins an 8 GB OpenNMS heap, sized for the real xlarge core (16 GB).
# This bed's core is medium (8 GB total), so the JVM cannot commit a heap the
# size of the whole machine and dies at startup with
#   Native memory allocation (mmap) failed to map 8589934592 bytes
# Scaled to fit. Another reason this bed measures nothing: OpenNMS is running
# on a quarter of its intended heap.
opennms_jvm_conf:
  JAVA_HEAP_SIZE: 2048
  JAVA_INITIAL_HEAP_SIZE: 2048
  ADDITIONAL_MANAGER_OPTIONS: "-XX:+UseG1GC -javaagent:/opt/prom-jmx-exporter/jmx_prometheus_javaagent.jar=9299:/opt/prom-jmx-exporter/config.yaml"
