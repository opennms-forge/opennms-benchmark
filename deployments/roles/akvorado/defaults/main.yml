# renovate: datasource=github-tags depName=akvorado/akvorado
akvorado_version: "2.4.1"
akvorado_src_url: "https://github.com/akvorado/akvorado/archive/refs/tags/v{{ akvorado_version }}.tar.gz"
akvorado_install_dir: /opt/akvorado

# Where the flow schema lives. Required — the bundled ClickHouse container is
# disabled (see templates/docker-compose-local.yml.j2) so that a dedicated
# ClickHouse node (clickhouse) can be measured on its own.
#
# Give an IP, not a hostname: these entries are resolved inside the Akvorado
# containers, and Docker's embedded resolver does not read the host's
# /etc/hosts. A lab hostname that resolves fine on the VM NXDOMAINs in the
# container.
# Example: ["192.0.2.232:9000"]
akvorado_clickhouse_servers: []

# ClickHouse fetches Akvorado's dictionaries (asns, networks, protocols, ports)
# over HTTP, from CREATE DICTIONARY ... SOURCE(HTTP(...)) pointed at the
# orchestrator. Upstream addresses it as http://akvorado-orchestrator:8080,
# which only resolves inside the compose network — an external ClickHouse
# cannot reach it, and Traefik's :8080 entrypoint is loopback-bound. So the
# orchestrator is published on the host's management address instead.
#
# Defaults to the inventory's lab_mgmt_ip: management, never the jump host's
# external DHCP address, so the unauthenticated orchestrator API stays off the
# public interface. Required — the role asserts it, because ClickHouse is
# always external here and a compose-internal URL it cannot resolve would only
# surface later as dictionaries that silently never load. Only the spec-driven
# topology-inventory module emits lab_mgmt_ip; elsewhere, set this explicitly.
akvorado_orchestrator_host: "{{ lab_mgmt_ip | default('') }}"
akvorado_orchestrator_port: 8090

# Kafka stays inside the compose stack: Akvorado uses it as its own inlet ->
# outlet buffer, not as a shared lab broker.
akvorado_kafka_brokers:
  - kafka:9092
akvorado_kafka_topic: flows
akvorado_kafka_partitions: 8
akvorado_kafka_replication_factor: 1

# No console-port variable: upstream publishes the console on 8081 and the
# private entrypoint on 127.0.0.1:8080, and Compose appends port lists, so any
# override here adds a binding rather than replacing one. Changing the console
# port means overriding traefik's published ports with a host port that is not
# already taken — see upstream's docker-compose-local.yml comments.

# Networks reported as Src/DstNetName/Role in the console. Site-specific, so
# there is no sensible default — left empty, the section is omitted entirely
# and Akvorado simply reports no network names.
# Example:
#   akvorado_networks:
#     198.51.100.0/24:
#       name: customers
#       role: customers
akvorado_networks: {}

# Synthetic flow exporters shipped by upstream. The lab's Deployment H has no
# load generator, so this is how the flow path is exercised end to end.
akvorado_demo_exporters: false
